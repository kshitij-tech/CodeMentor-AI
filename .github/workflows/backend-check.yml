name: Backend Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -p "test_*.py"

      - name: Build execution image
        run: docker build -t codementor-multi-runtime:ci -f docker/multi-runtime/Dockerfile docker/multi-runtime

      - name: Smoke test Python stdin execution
        run: |
          python - <<'PY'
          from unittest.mock import patch
          from backend.execution import run_python_stdio_tests

          source = "import sys\nprint(int(sys.stdin.read()) * 2)"
          cases = [{"input": "21\\n", "expected_output": "42\\n"}]

          with patch("backend.execution.EXECUTION_SANDBOX", "docker"):
              with patch("backend.execution.EXECUTION_DOCKER_IMAGE", "codementor-multi-runtime:ci"):
                  results = run_python_stdio_tests(source, cases, time_limit_seconds=1)

          assert results[0].passed, results[0]
          PY

      - name: Smoke test execution runtimes
        run: |
          docker run --rm --network none codementor-multi-runtime:ci bash -lc 'python --version && g++ --version && javac -version && node --version && tsc --version && go version && rustc --version'
          printf '21\n' | docker run --rm -i --network none codementor-multi-runtime:ci python -c 'import sys; print(int(sys.stdin.read()) * 2)'
          docker run --rm --network none codementor-multi-runtime:ci sh -lc 'printf "#include <iostream>\\nint main(){int x; std::cin >> x; std::cout << x * 2 << \\"\\n\\";}" > /runner/smoke.cpp && g++ -std=c++20 /runner/smoke.cpp -o /runner/smoke && printf "21\\n" | /runner/smoke'
