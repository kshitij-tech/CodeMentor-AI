html,body{height:100%;margin:0;overflow:hidden}

.monaco-syntax-error-line{

}
.mentor-thinking{
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.mentor-thinking .dot{
  width:4px;
  height:4px;
  border-radius:9999px;
  background:#94a3b8;
  animation:mentorThinkingDot 1.2s infinite ease-in-out;
}
.mentor-thinking .dot:nth-child(2){animation-delay:.15s}
.mentor-thinking .dot:nth-child(3){animation-delay:.3s}
@keyframes mentorThinkingDot{
  0%,60%,100%{opacity:.35;transform:translateY(0)}
  30%{opacity:1;transform:translateY(-2px)}
}

<script>
const API='http://127.0.0.1:8000';
const TOKEN_KEY='codementor_access_token';
const LANG_IDS=JSON.parse('{"Python":"python","C++":"cpp","Java":"java","JavaScript":"javascript","TypeScript":"typescript","Go":"go","Rust":"rust"}'); // normalized language map
let userId='unknown';
let problem=null;
let editor=null;
let mentorSessionId=null;
let mentorMessages=[];
let mentorThinking=false;
let hintLevel=1;
let syntaxTimer=null;
let syntaxRequestId=0;
let syntaxLineDecorations=[];
let lastExecution=null;
let workspaceLoadRequest=0;
let workspaceSaveTimer=null;
let workspaceSaveVersion=0;
let showingHistory=false;

const $=id=>document.getElementById(id);
function token(){return localStorage.getItem(TOKEN_KEY)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const e=$('toast');e.textContent=msg;e.classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.add('hidden'),2200)}
function requireAuth(){if(!token()){location.replace('auth.html');return false}return true}
function storagePrefix(){return 'codementor:user:'+userId}
function draftKey(){return problem?storagePrefix()+':draft:'+problem.slug+':'+$('language').value:null}

function showExecutionErrorMarker(data){
  if(!editor||!data||!data.error_line)return;
  const model=editor.getModel();
  const line=Math.max(1,Number(data.error_line)||1);
  const column=Math.max(1,Number(data.error_column)||1);
  const maxColumn=model.getLineMaxColumn(line);
  const endColumn=Math.min(
    maxColumn,
    Math.max(column+1,column+8)
  );
  const message=(data.results||[])
    .map(item=>item.message)
    .find(Boolean) || data.summary || data.status || 'Execution error.';

  monaco.editor.setModelMarkers(model,'codementor-execution',[{
    severity:monaco.MarkerSeverity.Error,
    message:String(message),
    startLineNumber:line,
    startColumn:Math.min(column,maxColumn),
    endLineNumber:line,
    endColumn:Math.max(column+1,endColumn),
    source:'CodeMentor'
  }]);

  syntaxLineDecorations=editor.deltaDecorations(
    syntaxLineDecorations,
    [{
      range:{startLineNumber:line,startColumn:1,endLineNumber:line,endColumn:1},
      options:{isWholeLine:true,className:'monaco-syntax-error-line'}
    }]
  );
}

function clearExecutionMarkers(){
  if(!editor)return;
  monaco.editor.setModelMarkers(editor.getModel(),'codementor-execution',[]);
}

function clearSyntaxMarkers(){
  if(!editor)return;
  monaco.editor.setModelMarkers(editor.getModel(),'codementor-syntax',[]);
  monaco.editor.setModelMarkers(editor.getModel(),'codementor-execution',[]);
  syntaxLineDecorations=editor.deltaDecorations(syntaxLineDecorations,[]);
  const status=$('syntax-status');
  status.classList.add('hidden');
  status.textContent='';
  status.title='';
}

function showSyntaxDiagnostic(diagnostic){
  if(!editor)return;
  const model=editor.getModel();
  if(!diagnostic||diagnostic.valid){
    clearSyntaxMarkers();
    return;
  }

  const line=Math.max(1,Number(diagnostic.line)||1);
  const column=Math.max(1,Number(diagnostic.column)||1);
  const endLine=Math.max(line,Number(diagnostic.end_line)||line);
  const endColumn=Math.max(
    column+1,
    Number(diagnostic.end_column)||column+1
  );

  monaco.editor.setModelMarkers(model,'codementor-syntax',[{
    severity:monaco.MarkerSeverity.Error,
    message:String(diagnostic.message||'Syntax error.'),
    startLineNumber:line,
    startColumn:column,
    endLineNumber:endLine,
    endColumn:endColumn,
    source:'CodeMentor'
  }]);

  syntaxLineDecorations=editor.deltaDecorations(
    syntaxLineDecorations,
    [{
      range:{
        startLineNumber:line,
        startColumn:1,
        endLineNumber:line,
        endColumn:1
      },
      options:{
        isWholeLine:true,
        className:'monaco-syntax-error-line'
      }
    }]
  );

  const status=$('syntax-status');
  const message='Syntax error · line '+line+' · '+String(diagnostic.message||'Syntax error.');
  status.textContent=message;
  status.title=message;
  status.classList.remove('hidden');
}

async function validateSyntax(){
  if(!editor||!problem)return;
  const language=$('language').value;
  if(language!=='Python'){
    clearSyntaxMarkers();
    return;
  }

  const request=++syntaxRequestId;
  try{
    const res=await fetch(API+'/execution/validate',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        Authorization:'Bearer '+token()
      },
      body:JSON.stringify({
        problem_slug:problem.slug,
        language,
        code:editor.getValue(),
        mode:'run'
      })
    });
    if(request!==syntaxRequestId)return;
    if(res.status===401){
      localStorage.removeItem(TOKEN_KEY);
      location.replace('auth.html');
      return;
    }
    const data=await res.json().catch(()=>({}));
    if(!res.ok){
      clearSyntaxMarkers();
      return;
    }
    showSyntaxDiagnostic(data);
  }catch(_err){
    if(request===syntaxRequestId)clearSyntaxMarkers();
  }
}

function scheduleSyntaxValidation(){
  clearTimeout(syntaxTimer);
  syntaxTimer=setTimeout(()=>{void validateSyntax()},280);
}

function cleanProblemDescription(value){
  const text=String(value??'').trim();
  if(!text)return '';
  const match=text.search(/\bexamples?\s*:?[ \t]*(?=(?:(?:example\s*\d+\s*[:.)-]?\s*)|(?:\d+[.\):-]\s*)|(?:[-*]\s*))?input\b)/i);
  return match>20?text.slice(0,match).trim():text;
}

function showError(message){
  $('loading-state').textContent=message;
  $('loading-state').className='h-full flex items-center justify-center text-sm text-rose-500 p-6 text-center';
  $('problem-body').classList.add('hidden');
}
function difficultyClass(d){
  if(d==='Easy')return 'bg-emerald-100 text-emerald-800';
  if(d==='Medium')return 'bg-amber-100 text-amber-900';
  if(d==='Hard')return 'bg-rose-100 text-rose-800';
  return 'bg-slate-100 text-slate-600';
}
function fallbackStarterCode(language){
  const templates={
    Python:`import sys

# Read all input from standard input.
input_data = sys.stdin.read()

# Parse the input according to the problem statement.
# Compute the result and print it.
result = None
print(result)
`,
    "C++":`#include <bits/stdc++.h>
using namespace std;

int main() {
    ios::sync_with_stdio(false);
    cin.tie(nullptr);

    // Read input from standard input.
    // Parse it according to the problem statement.
    // Compute the result and print it.
    return 0;
}
`,
    Java:`import java.io.*;
import java.util.*;

public class Main {
    public static void main(String[] args) throws Exception {
        BufferedReader br = new BufferedReader(new InputStreamReader(System.in));
        StringBuilder input = new StringBuilder();
        String line;
        while ((line = br.readLine()) != null) {
            input.append(line).append('\\n');
        }

        // Parse input according to the problem statement.
        // Compute the result and print it.
        System.out.println();
    }
}
`,
    JavaScript:`const fs = require('fs');

const input = fs.readFileSync(0, 'utf8');

// Parse input according to the problem statement.
// Compute the result and print it.
const result = '';
process.stdout.write(String(result));
`,
    TypeScript:`declare const require: (name: string) => any;
const fs: any = require('fs');

const input: string = fs.readFileSync(0, 'utf8');

// Parse input according to the problem statement.
// Compute the result and print it.
const result: any = '';
process.stdout.write(String(result));
`,
    Go:`package main

import (
    "fmt"
    "io"
    "os"
)

func main() {
    inputBytes, err := io.ReadAll(os.Stdin)
    if err != nil {
        panic(err)
    }
    input := string(inputBytes)
    _ = input

    // Parse input according to the problem statement.
    // Compute the result and print it.
    fmt.Println()
}
`,
    Rust:`use std::io::{self, Read};

fn main() {
    let mut input = String::new();
    io::stdin().read_to_string(&mut input).unwrap();

    // Parse input according to the problem statement.
    // Compute the result and print it.
    println!();
}
`
  };
  return templates[language]||'';
}
function starterCode(language){
  const starter=(problem&&problem.starter_code)||{};
  const value=starter[language];
  return typeof value==='string'&&value.trim()
    ? value
    : fallbackStarterCode(language);
}

function syncLanguageAvailability(){
  const select=$('language');
  if(!select||!problem)return;

  [...select.options].forEach(option=>{
    option.disabled=false;
  });
  select.title='Write a normal stdin/stdout program. You are responsible for reading the input and printing the result.';
}
function isGenericFunctionDraft(language,value){
  if(typeof value!=='string')return false;
  const compact=value.trim().replace(/\s+/g,'');
  const signatures={
    Python:['defsolve(*args):','defsolve(**kwargs):'],
    'C++':['intsolve(){','longlongsolve(){'],
    Java:['intsolve(){','publicintsolve(){','longsolve(){','publiclongsolve(){'],
    JavaScript:['functionsolve(...args){'],
    TypeScript:['functionsolve(...args:any[]):any{'],
    Go:['funcsolve(args...interface{})interface{}{'],
    Rust:['fnsolve(args:&[String])->String{']
  };
  return (signatures[language]||[]).some(signature=>compact.includes(signature));
}
function functionDraftMatchesContract(language,value){
  const expected=(problem?.editor_input_schema||[])
    .map(item=>item&&item.name)
    .filter(name=>typeof name==='string'&&name.trim());
  if(problem?.editor_execution_mode!=='function'||!expected.length)return true;
  if(typeof value!=='string')return false;

  const match=value.match(/\\b(?:def\\s+solve|function\\s+solve|solve)\\s*\\(([^)]*)\\)/);
  if(!match)return false;

  const parts=match[1].split(',').map(part=>part.trim()).filter(Boolean);
  if(parts.length!==expected.length)return false;

  const actual=parts.map(part=>{
    part=part.replace(/^\\s*[*&]+/,'').trim();
    part=part.split('=',1)[0].trim();
    part=part.split(':',1)[0].trim();
    if(language==='Go')return (part.match(/[A-Za-z_][A-Za-z0-9_]*/)||[]).pop()||'';
    if(language==='Java'||language==='C++')return (part.match(/[A-Za-z_][A-Za-z0-9_]*\\s*$/)||[])[0]?.trim()||'';
    return (part.match(/[A-Za-z_][A-Za-z0-9_]*$/)||[])[0]||'';
  });

  return actual.every((name,index)=>name===expected[index]);
}
function isStdioBoilerplateDraft(language,value){
  if(typeof value!=='string')return false;
  const compact=value.trim().replace(/\s+/g,'');
  if(/solve\(stringinput_data\)/.test(compact)||/solvestringinput_data/.test(compact)) return true;
  const signatures={
    Python:['importsys','defsolve():','if__name__==\'__main__\':solve()'],
    'C++':['intmain(){','return0;}'],
    Java:['publicclassMain{','publicstaticvoidmain(String[]args)'],
    JavaScript:['constfs=require(\'fs\')','process.stdout.write'],
    TypeScript:['constfs:any=require(\'fs\')','process.stdout.write'],
    Go:['funcmain(){','bufio.NewReader(os.Stdin)'],
    Rust:['fnmain(){','io::stdin().read_to_string']
  };
  return (signatures[language]||[]).filter(signature=>compact.includes(signature)).length>=2;
}
function loadDraft(){
  if(!problem||!editor)return false;
  const language=$('language').value;
  const saved=localStorage.getItem(draftKey());
  const hasSaved=typeof saved==='string'&&saved.trim().length>0;
  const staleGeneric=isGenericFunctionDraft(language,saved);
  const staleStdio=isStdioBoilerplateDraft(language,saved);
  const staleCallable=hasSaved && /\\b(?:def\\s+solve|function\\s+solve|func\\s+solve|fn\\s+solve|class\\s+Solution)\\b/.test(saved);
  const stale=staleGeneric||staleStdio||staleCallable;
  const useSaved=hasSaved&&!stale;
  editor.setValue(useSaved?saved:starterCode(language));
  $('save-status').textContent=useSaved?'Local draft':'Starter';
  if(stale)localStorage.removeItem(draftKey());
  scheduleSyntaxValidation();
  return useSaved;
}

async function loadWorkspace(language=$('language').value){
  if(!problem||!editor)return;
  const request=++workspaceLoadRequest;
  try{
    const res=await fetch(API+'/workspace?problem_slug='+encodeURIComponent(problem.slug)+'&language='+encodeURIComponent(language),{
      headers:{Authorization:'Bearer '+token()}
    });
    if(request!==workspaceLoadRequest)return;
    if(res.status===401){
      localStorage.removeItem(TOKEN_KEY);
      location.replace('auth.html');
      return;
    }
    if(!res.ok)throw new Error('Workspace request failed.');
    const data=await res.json();
    if(request!==workspaceLoadRequest)return;

    if(typeof data.code==='string'&&data.code.trim()){
      editor.setValue(data.code);
      localStorage.setItem(draftKey(),data.code);
      $('save-status').textContent='Saved remotely';
      scheduleSyntaxValidation();
      return;
    }

    const usedLocal=loadDraft();
    if(usedLocal){
      $('save-status').textContent='Saving draft…';
      void saveWorkspace();
    }
  }catch(_err){
    if(request!==workspaceLoadRequest)return;
    loadDraft();
    $('save-status').textContent='Local draft';
  }
}

function saveWorkspace(){
  if(!problem||!editor)return Promise.resolve();
  const language=$('language').value;
  const code=editor.getValue();
  const version=++workspaceSaveVersion;
  $('save-status').textContent='Saving…';
  return fetch(API+'/workspace',{
    method:'PUT',
    headers:{
      'Content-Type':'application/json',
      Authorization:'Bearer '+token()
    },
    body:JSON.stringify({
      problem_slug:problem.slug,
      language,
      code
    })
  }).then(async res=>{
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.detail||'Workspace save failed.');
    if(version===workspaceSaveVersion)$('save-status').textContent='Saved remotely';
    return data;
  }).catch(err=>{
    if(version===workspaceSaveVersion)$('save-status').textContent='Saved locally';
    console.warn('Workspace save failed:',err);
  });
}

function queueWorkspaceSave(){
  if(!problem||!editor)return;
  localStorage.setItem(draftKey(),editor.getValue());
  $('save-status').textContent='Saving…';
  clearTimeout(workspaceSaveTimer);
  workspaceSaveTimer=setTimeout(()=>{void saveWorkspace()},700);
}

function renderProblem(){
  $('header-title').textContent=problem.title;
  $('title').textContent=problem.title;
  $('difficulty').textContent=problem.difficulty||'Unknown';
  $('difficulty').className='px-2 py-1 rounded text-[10px] font-semibold '+difficultyClass(problem.difficulty);
  $('source').textContent=problem.source||'catalog';
  $('topics').innerHTML=(problem.topics||[]).map(t=>'<a href="practice.html?topic='+encodeURIComponent(t)+'" class="px-2 py-1 rounded-full bg-slate-100 text-slate-500 text-[9px] hover:bg-indigo-100 hover:text-indigo-700" title="View '+esc(t)+' problems">'+esc(t)+'</a>').join('');
  $('description').textContent=cleanProblemDescription(problem.description)||'No statement available.';
  $('examples').innerHTML=(problem.examples||[]).map((e,i)=>'<div class="rounded-xl bg-slate-50 border border-slate-200 p-3"><div class="mono text-[9px] text-indigo-600 uppercase">Example '+(i+1)+'</div><div class="mt-2 text-[11px]"><div><b>Input:</b> <code>'+esc(e.input)+'</code></div><div class="mt-1"><b>Output:</b> <code>'+esc(e.output)+'</code></div></div></div>').join('');
  const constraints=problem.constraints||[];
  $('constraints').innerHTML=constraints.length?constraints.map(c=>'<li>'+esc(c)+'</li>').join(''):'<li>No constraints provided.</li>';
  syncLanguageAvailability();
  $('loading-state').classList.add('hidden');
  $('problem-body').classList.remove('hidden');
}
function renderMentor(){
  const host=$('mentor-messages');
  let html=mentorMessages.length
    ? mentorMessages.map(m=>{
        const user=m.role==='user';
        return '<div class="'+(user?'text-right':'text-left')+'"><div class="text-[9px] text-slate-500 mb-1">'+(user?'You':'AI Mentor')+'</div><div class="mentor-msg inline-block max-w-[90%] text-left px-3 py-2 rounded-xl '+(user?'bg-indigo-600':'bg-slate-800 border border-slate-700')+' text-[11px]">'+esc(m.text)+'</div></div>';
      }).join('')
    : '<div class="text-[11px] text-slate-500">Ask for a hint, debugging help, complexity analysis, edge cases, or a conceptual explanation.</div>';

  if(mentorThinking){
    html+='<div class="text-left"><div class="text-[9px] text-slate-500 mb-1">AI Mentor</div><div class="mentor-msg inline-flex items-center gap-2 px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-[11px]"><span>Thinking</span><span class="mentor-thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div></div>';
  }

  host.innerHTML=html;
  host.scrollTop=host.scrollHeight;
}
async function loadMentorHistory(){
  try{
    const res=await fetch(API+'/mentor/sessions?scope=practice&problem_slug='+encodeURIComponent(problem.slug),{headers:{Authorization:'Bearer '+token()}});
    if(!res.ok)return;
    const sessions=await res.json();
    if(!sessions.length){renderMentor();return}
    mentorSessionId=sessions[0].id;
    const detail=await fetch(API+'/mentor/sessions/'+mentorSessionId,{headers:{Authorization:'Bearer '+token()}});
    if(!detail.ok)return;
    const data=await detail.json();
    mentorMessages=(data.messages||[]).map(m=>({role:m.role==='user'?'user':'assistant',text:m.content}));
    renderMentor();
  }catch(_err){renderMentor()}
}
async function askMentor(action,question=null){
  if(!problem||!editor)return;
  const presets={hint:'Give me the next hint.',debug:'Help me debug my current code.',complexity:'What is the time and space complexity of my current approach?',edge:'What edge cases should I test?'};
  const text=question||presets[action]||'Help me with this problem.';
  mentorMessages.push({role:'user',text});
  mentorThinking=true;
  renderMentor();
  $('mentor-send').disabled=true;
  document.querySelectorAll('.mentor-action').forEach(b=>b.disabled=true);
  try{
    const res=await fetch(API+'/mentor/analyze',{
      method:'POST',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},
      body:JSON.stringify({
        problem_slug:problem.slug,
        language:$('language').value,
        code:editor.getValue(),
        action:action||'question',
        question:action==='question'?text:null,
        hint_level:hintLevel,
        execution:lastExecution,
        session_id:mentorSessionId
      })
    });
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.detail||'Mentor request failed.');
    mentorSessionId=data.session_id||mentorSessionId;
    mentorMessages.push({role:'assistant',text:data.answer||'No mentor response.'});
    if(action==='hint')hintLevel=Math.min(4,hintLevel+1);
    renderMentor();
  }catch(err){
    mentorMessages.push({role:'assistant',text:err.message||'Unable to contact AI Mentor.'});
    renderMentor();
  }finally{
    mentorThinking=false;
    $('mentor-send').disabled=false;
    document.querySelectorAll('.mentor-action').forEach(b=>b.disabled=false);
    renderMentor();
  }
}
function renderResults(data){
  lastExecution=data;
  showingHistory=false;
  $('results').classList.remove('hidden');
  $('result-body').classList.remove('hidden');
  $('history-body').classList.add('hidden');
  $('history-btn').textContent='History';
  $('result-badge').textContent=data.status||'Complete';
  const host=$('result-body');
  host.innerHTML=(data.results||[]).map(t=>{
    const pass=!!t.passed;
    return '<div class="rounded-lg border '+(pass?'border-emerald-800':'border-rose-800')+' bg-slate-950 p-3"><div class="flex justify-between text-[10px]"><span>'+esc(t.test||'Test')+' · '+esc(t.status||'')+'</span><span>'+esc(t.runtime_ms||'')+' ms</span></div>'+(t.message?'<div class="mt-1 text-[10px] text-slate-400">'+esc(t.message)+'</div>':'')+'<\\/div>';
  }).join('')||'<div class="text-xs text-slate-500">No test results.</div>';
}

function renderSubmissionHistory(items){
  const host=$('history-body');
  if(!items.length){
    host.innerHTML='<div class="text-xs text-slate-500">No submissions for this problem yet.</div>';
    return;
  }
  host.innerHTML=items.map(item=>{
    const pass=item.status==='Accepted';
    const when=item.created_at?new Date(item.created_at.endsWith('Z')?item.created_at:item.created_at+'Z').toLocaleString([],{
      month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'
    }):'Unknown time';
    return '<div class="rounded-lg border '+(pass?'border-emerald-900':'border-slate-700')+' bg-slate-950 p-3">'+
      '<div class="flex items-center justify-between gap-2">'+
        '<div class="flex items-center gap-2"><span class="text-[10px] font-semibold">'+esc(item.status)+'</span><span class="text-[9px] text-slate-500">'+esc(item.mode)+'</span></div>'+
        '<span class="mono text-[9px] text-slate-500">'+esc(when)+'</span>'+
      '</div>'+
      '<div class="mt-2 flex items-center gap-3 text-[9px] text-slate-400"><span>'+esc(item.language)+'</span><span>'+esc(item.summary||'')+'</span>'+(item.runtime_ms==null?'':'<span>'+esc(item.runtime_ms)+' ms</span>')+'</div>'+
    '</div>';
  }).join('');
}

async function loadSubmissionHistory(){
  if(!problem)return;
  try{
    const res=await fetch(API+'/workspace/history?problem_slug='+encodeURIComponent(problem.slug),{
      headers:{Authorization:'Bearer '+token()}
    });
    if(res.status===401){
      localStorage.removeItem(TOKEN_KEY);
      location.replace('auth.html');
      return;
    }
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.detail||'Unable to load submission history.');
    renderSubmissionHistory(data.items||[]);
  }catch(err){
    $('history-body').innerHTML='<div class="text-xs text-rose-400">'+esc(err.message||'Unable to load submission history.')+'</div>';
  }
}

async function execute(mode){
  if(!problem||!editor)return;
  const code=editor.getValue();
  if(!code.trim()){toast('Write code first.');return}
  $('run-btn').disabled=true;$('submit-btn').disabled=true;
  const activeButton=mode==='submit'?$ ('submit-btn'):$ ('run-btn');
  activeButton?.classList.add('cm-loading');
  activeButton?.querySelector('.material-symbols-outlined')?.classList.add('opacity-50');
  $('execution-status').textContent=mode==='submit'?'Submitting…':'Running…';
  try{
    const res=await fetch(API+'/execution/run',{
      method:'POST',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},
      body:JSON.stringify({problem_slug:problem.slug,language:$('language').value,code,mode})
    });
    const data=await res.json().catch(()=>({}));
    if(res.status===401){localStorage.removeItem(TOKEN_KEY);location.replace('auth.html');return}
    if(!res.ok)throw new Error(data.detail||'Execution failed.');
    renderResults(data);
    void loadSubmissionHistory();
    if(data.status==='Accepted'){
      clearExecutionMarkers();
    }else{
      showExecutionErrorMarker(data);
    }
    $('execution-status').textContent=(data.status||'Complete')+' · '+(data.summary||'');
  }catch(err){
    const rawMessage=err?.message||'Execution failed.';
    const message=rawMessage==='Failed to fetch'
      ? 'Cannot reach the CodeMentor API at '+API+'. Make sure Uvicorn is running and check the backend console for Docker/runtime errors.'
      : rawMessage;
    $('execution-status').textContent=message;
    $('results').classList.remove('hidden');
    $('result-body').innerHTML='<div class="text-xs text-rose-400 p-3">'+esc(message)+'</div>';
  }finally{
    $('run-btn').disabled=false;$('submit-btn').disabled=false;
    $('run-btn').classList.remove('cm-loading');$('submit-btn').classList.remove('cm-loading');
    $('run-btn').querySelector('.material-symbols-outlined')?.classList.remove('opacity-50');
    $('submit-btn').querySelector('.material-symbols-outlined')?.classList.remove('opacity-50');
  }
}
function initEditor(){
  require.config({paths:{vs:'https://cdn.jsdelivr.net/npm/monaco-editor/min/vs'}});
  require(['vs/editor/editor.main'],()=>{
    editor=monaco.editor.create($('editor'),{
      value:'',
      language:LANG_IDS[$('language').value],
      theme:'vs-dark',
      automaticLayout:true,
      fontFamily:'JetBrains Mono, monospace',
      fontSize:13,
      minimap:{enabled:true},
      padding:{top:14,bottom:14},
      scrollBeyondLastLine:false
    });
    editor.onDidChangeModelContent(()=>{
      if(!problem)return;
      queueWorkspaceSave();
      scheduleSyntaxValidation();
    });
    if(problem)void loadWorkspace();
    $('run-btn').disabled=!problem;
    $('submit-btn').disabled=!problem;
  },err=>showError('Code editor failed to load. Refresh the page.'));
}
async function load(){
  if(!requireAuth())return;

  const slug=new URLSearchParams(location.search).get('problem');
  if(!slug){location.replace('practice.html');return}

  // Start the problem request immediately. Profile/account data is independent
  // and should never delay the statement/editor workspace.
  const problemPromise=fetch(
    API+'/problems/'+encodeURIComponent(slug),
    {headers:{Authorization:'Bearer '+token()}}
  );
  const profilePromise=Promise.all([
    fetch(API+'/profile',{headers:{Authorization:'Bearer '+token()}}),
    fetch(API+'/auth/me',{headers:{Authorization:'Bearer '+token()}})
  ]);

  try{
    const res=await problemPromise;
    if(res.status===401){localStorage.removeItem(TOKEN_KEY);location.replace('auth.html');return}
    if(!res.ok){
      const body=await res.json().catch(()=>({}));
      throw new Error(body.detail||'Problem not found.');
    }

    problem=await res.json();
    renderProblem();
    $('language').dispatchEvent(new Event('change'));
    $('run-btn').disabled=false;
    $('submit-btn').disabled=false;

    // Mentor history is supplementary; don't hold the problem workspace hostage
    // while its session data is loading.
    void loadMentorHistory();
  }catch(err){
    showError(err.message||'Unable to load the requested problem.');
  }

  try{
    const [profileRes,userRes]=await profilePromise;
    if(profileRes.status===401||userRes.status===401){
      localStorage.removeItem(TOKEN_KEY);
      location.replace('auth.html');
      return;
    }
    const profile=profileRes.ok?await profileRes.json():{};
    const user=userRes.ok?await userRes.json():{};
    userId=String(user.id||'unknown');
    $('account-name').textContent=profile.full_name||'CodeMentor User';
    $('account-email').textContent=user.email||'Signed in';

    if(profile.preferred_language&&[...$('language').options].some(o=>o.value===profile.preferred_language)){
      $('language').value=profile.preferred_language;
    }

    if(problem){
      syncLanguageAvailability();
      void loadWorkspace($('language').value);
    }
    restoreResultsHeight();
  }catch(err){
    console.warn('Problem workspace identity load failed:',err);
  }
}
$('back-btn').addEventListener('click',()=>location.href='practice.html');
$('account-btn').addEventListener('click',e=>{e.stopPropagation();$('account-menu').classList.toggle('hidden')});
document.addEventListener('click',e=>{if(!$('account-menu').contains(e.target)&&e.target!==$('account-btn'))$('account-menu').classList.add('hidden')});
$('logout-btn').addEventListener('click',()=>{localStorage.removeItem(TOKEN_KEY);location.replace('auth.html')});
$('language').addEventListener('change',()=>{
  if(!editor||!problem)return;
  monaco.editor.setModelLanguage(editor.getModel(),LANG_IDS[$('language').value]);
  clearSyntaxMarkers();

});
$('reset-btn').addEventListener('click',()=>{

  localStorage.removeItem(draftKey());
  editor.setValue(starterCode($('language').value));
  $('save-status').textContent='Saving reset…';

});
$('run-btn').addEventListener('click',()=>execute('run'));
$('submit-btn').addEventListener('click',()=>execute('submit'));
$('clear-results').addEventListener('click',()=>{
  $('results').classList.add('hidden');
  $('result-body').innerHTML='';
  $('history-body').innerHTML='';
  lastExecution=null;
});
$('history-btn').addEventListener('click',async()=>{
  showingHistory=!showingHistory;

  $('history-body').classList.toggle('hidden',!showingHistory);

$('mentor-open').addEventListener('click',()=>{const panel=$('mentor-panel');const isOpen=!panel.classList.contains('hidden');panel.classList.toggle('hidden',isOpen);panel.classList.toggle('flex',!isOpen);if(!isOpen)renderMentor()});
$('mentor-close').addEventListener('click',()=>{$('mentor-panel').classList.add('hidden');$('mentor-panel').classList.remove('flex')});
$('mentor-clear').addEventListener('click',async()=>{mentorMessages=[];mentorSessionId=null;renderMentor()});
document.querySelectorAll('.mentor-action').forEach(b=>b.addEventListener('click',()=>askMentor(b.dataset.mentor)));
$('mentor-send').addEventListener('click',()=>{const q=$('mentor-input').value.trim();if(q){$('mentor-input').value='';askMentor('question',q)}});
$('mentor-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();$('mentor-send').click()}});
$('splitter').addEventListener('pointerdown',e=>{
  const main=document.querySelector('main');
  const move=ev=>{const width=Math.max(320,Math.min(main.clientWidth-450,ev.clientX));main.style.gridTemplateColumns=width+'px 6px minmax(0,1fr)'};
  const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
});
function initResultsResizer(){
  const results=$('results');
  const handle=$('results-resizer');
  const main=document.querySelector('main');
  if(!results||!handle||!main)return;

  const storageKey=()=> 'cm_results_height_'+(userId||'unknown');
  const getMaxHeight=()=>Math.max(
    180,
    Math.min(
      Math.floor(main.getBoundingClientRect().height*.70),
      Math.floor(window.innerHeight*.70)
    )
  );

  const saved=Number(localStorage.getItem(storageKey()));
  if(Number.isFinite(saved)&&saved>=140){
    results.style.height=Math.min(saved,getMaxHeight())+'px';
  }

  let dragging=false;
  let startY=0;
  let startHeight=260;

  const move=e=>{
    if(!dragging)return;
    const next=Math.max(140,Math.min(getMaxHeight(),startHeight+(startY-e.clientY)));
    results.style.height=Math.round(next)+'px';
    editor?.layout();
  };

  const stop=()=>{
    if(!dragging)return;
    dragging=false;
    document.body.style.userSelect='';
    localStorage.setItem(
      storageKey(),
      String(Math.round(results.getBoundingClientRect().height))
    );
    window.removeEventListener('pointermove',move);
    window.removeEventListener('pointerup',stop);
    window.removeEventListener('pointercancel',stop);
  };

  handle.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    e.preventDefault();
    dragging=true;
    startY=e.clientY;
    startHeight=results.getBoundingClientRect().height;
    document.body.style.userSelect='none';
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',stop);
    window.addEventListener('pointercancel',stop);
  });
}

function restoreResultsHeight(){
  const results=$('results');
  if(!results)return;
  const saved=Number(localStorage.getItem('cm_results_height_'+(userId||'unknown')));
  if(Number.isFinite(saved)&&saved>=140){
    const main=document.querySelector('main');
    const max=Math.max(180,Math.min(
      Math.floor(main.getBoundingClientRect().height*.70),
      Math.floor(window.innerHeight*.70)
    ));
    results.style.height=Math.min(saved,max)+'px';
  }
}

initEditor();
initResultsResizer();
load();
