<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeMentor AI — Problem Solver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:FILL@0..1&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--primary:#4338ca}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:"Plus Jakarta Sans",sans-serif;background:#f8f9ff}
.mono{font-family:"JetBrains Mono",monospace}
.scroll{scrollbar-width:thin;scrollbar-color:#94a3b8 transparent}
.split{cursor:col-resize}
.mentor-msg{white-space:pre-wrap;line-height:1.6}
#results-resizer{touch-action:none;cursor:row-resize;user-select:none}
#results-resizer:hover,#results-resizer:active{background:#6366f1}
#results{min-height:140px}
#result-body{min-height:0;overscroll-behavior:contain}
#mentor-panel{
  height:min(560px,calc(100vh - 10rem));
  max-height:calc(100vh - 10rem);
  min-height:0;
  overflow:hidden;
}
.mentor-thinking{
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.mentor-thinking .dot{
  width:4px;
  height:4px;
  border-radius:9999px;
  background:#94a3b8;
  animation:mentorThinkingDot 1.2s infinite ease-in-out;
}
.mentor-thinking .dot:nth-child(2){animation-delay:.15s}
.mentor-thinking .dot:nth-child(3){animation-delay:.3s}
@keyframes mentorThinkingDot{
  0%,60%,100%{opacity:.35;transform:translateY(0)}
  30%{opacity:1;transform:translateY(-2px)}
}

@media (max-width: 767px) {
  html,body { height:auto; min-height:100%; overflow:auto; }
  body { min-width:0; }
  header { position:sticky; top:0; z-index:60; }
  main {
    height:auto;
    min-height:calc(100vh - 3.5rem);
    display:flex;
    flex-direction:column;
  }
  main > section:first-child {
    flex:0 0 42vh;
    min-height:280px;
    border-right:0;
    border-bottom:1px solid #e2e8f0;
  }
  #splitter { display:none; }
  main > section:last-child {
    flex:1 1 auto;
    min-height:58vh;
  }
  #results {
    max-height:70vh;
  }
  #mentor-open {
    right:1rem;
    bottom:4.75rem;
  }
  #mentor-panel {
    right:1rem;
    left:1rem;
    width:auto;
    bottom:4.75rem;
    top:4.5rem;
    height:auto;
    max-height:none;
  }
}

</head>

<div id="toast" class="hidden fixed left-1/2 -translate-x-1/2 bottom-5 z-[70] px-4 py-2.5 rounded-lg bg-slate-900 text-white text-xs shadow-xl"></div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor/min/vs/loader.js"></script>
<script>
const API='http://127.0.0.1:8000';
const TOKEN_KEY='codementor_access_token';
const LANG_IDS=JSON.parse('{"Python":"python","C++":"cpp","Java":"java","JavaScript":"javascript","TypeScript":"typescript","Go":"go","Rust":"rust"}'); // normalized language map
let userId='unknown';
let problem=null;
let editor=null;
let mentorSessionId=null;
let mentorMessages=[];
let mentorThinking=false;
let hintLevel=1;
let lastExecution=null;

const $=id=>document.getElementById(id);
function token(){return localStorage.getItem(TOKEN_KEY)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const e=$('toast');e.textContent=msg;e.classList.remove('hidden');clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.classList.add('hidden'),2200)}
function requireAuth(){if(!token()){location.replace('auth.html');return false}return true}
function storagePrefix(){return 'codementor:user:'+userId}
function draftKey(){return problem?storagePrefix()+':draft:'+problem.slug+':'+$('language').value:null}

function cleanProblemDescription(value){
  const text=String(value??'').trim();
  if(!text)return '';
  const match=text.search(/\bexamples?\s*:?[ \t]*(?=(?:(?:example\s*\d+\s*[:.)-]?\s*)|(?:\d+[.\):-]\s*)|(?:[-*]\s*))?input\b)/i);
  return match>20?text.slice(0,match).trim():text;
}

function showError(message){
  $('loading-state').textContent=message;
  $('loading-state').className='h-full flex items-center justify-center text-sm text-rose-500 p-6 text-center';
  $('problem-body').classList.add('hidden');
}
function difficultyClass(d){
  if(d==='Easy')return 'bg-emerald-100 text-emerald-800';
  if(d==='Medium')return 'bg-amber-100 text-amber-900';
  if(d==='Hard')return 'bg-rose-100 text-rose-800';
  return 'bg-slate-100 text-slate-600';
}
function starterCode(language){
  const starter=(problem&&problem.starter_code)||{};
  return starter[language]||'';
}
function loadDraft(){
  if(!problem||!editor)return;
  const saved=localStorage.getItem(draftKey());
  editor.setValue(saved!==null?saved:starterCode($('language').value));
  $('save-status').textContent=saved!==null?'Draft restored':'Starter';
}
function renderProblem(){
  $('header-title').textContent=problem.title;
  $('title').textContent=problem.title;
  $('difficulty').textContent=problem.difficulty||'Unknown';
  $('difficulty').className='px-2 py-1 rounded text-[10px] font-semibold '+difficultyClass(problem.difficulty);
  $('source').textContent=problem.source||'catalog';
  $('topics').innerHTML=(problem.topics||[]).map(t=>'<a href="practice.html?topic='+encodeURIComponent(t)+'" class="px-2 py-1 rounded-full bg-slate-100 text-slate-500 text-[9px] hover:bg-indigo-100 hover:text-indigo-700" title="View '+esc(t)+' problems">'+esc(t)+'</a>').join('');
  $('description').textContent=cleanProblemDescription(problem.description)||'No statement available.';
  $('examples').innerHTML=(problem.examples||[]).map((e,i)=>'<div class="rounded-xl bg-slate-50 border border-slate-200 p-3"><div class="mono text-[9px] text-indigo-600 uppercase">Example '+(i+1)+'</div><div class="mt-2 text-[11px]"><div><b>Input:</b> <code>'+esc(e.input)+'</code></div><div class="mt-1"><b>Output:</b> <code>'+esc(e.output)+'</code></div></div></div>').join('');
  const constraints=problem.constraints||[];
  $('constraints').innerHTML=constraints.length?constraints.map(c=>'<li>'+esc(c)+'</li>').join(''):'<li>No constraints provided.</li>';
  $('loading-state').classList.add('hidden');
  $('problem-body').classList.remove('hidden');
}
function renderMentor(){
  const host=$('mentor-messages');
  let html=mentorMessages.length
    ? mentorMessages.map(m=>{
        const user=m.role==='user';
        return '<div class="'+(user?'text-right':'text-left')+'"><div class="text-[9px] text-slate-500 mb-1">'+(user?'You':'AI Mentor')+'</div><div class="mentor-msg inline-block max-w-[90%] text-left px-3 py-2 rounded-xl '+(user?'bg-indigo-600':'bg-slate-800 border border-slate-700')+' text-[11px]">'+esc(m.text)+'</div></div>';
      }).join('')
    : '<div class="text-[11px] text-slate-500">Ask for a hint, debugging help, complexity analysis, edge cases, or a conceptual explanation.</div>';

  if(mentorThinking){
    html+='<div class="text-left"><div class="text-[9px] text-slate-500 mb-1">AI Mentor</div><div class="mentor-msg inline-flex items-center gap-2 px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-[11px]"><span>Thinking</span><span class="mentor-thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span></div></div>';
  }

  host.innerHTML=html;
  host.scrollTop=host.scrollHeight;
}
async function loadMentorHistory(){
  try{
    const res=await fetch(API+'/mentor/sessions?scope=practice&problem_slug='+encodeURIComponent(problem.slug),{headers:{Authorization:'Bearer '+token()}});
    if(!res.ok)return;
    const sessions=await res.json();
    if(!sessions.length){renderMentor();return}
    mentorSessionId=sessions[0].id;
    const detail=await fetch(API+'/mentor/sessions/'+mentorSessionId,{headers:{Authorization:'Bearer '+token()}});
    if(!detail.ok)return;
    const data=await detail.json();
    mentorMessages=(data.messages||[]).map(m=>({role:m.role==='user'?'user':'assistant',text:m.content}));
    renderMentor();
  }catch(_err){renderMentor()}
}
async function askMentor(action,question=null){
  if(!problem||!editor)return;
  const presets={hint:'Give me the next hint.',debug:'Help me debug my current code.',complexity:'What is the time and space complexity of my current approach?',edge:'What edge cases should I test?'};
  const text=question||presets[action]||'Help me with this problem.';
  mentorMessages.push({role:'user',text});
  mentorThinking=true;
  renderMentor();
  $('mentor-send').disabled=true;
  document.querySelectorAll('.mentor-action').forEach(b=>b.disabled=true);
  try{
    const res=await fetch(API+'/mentor/analyze',{
      method:'POST',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},
      body:JSON.stringify({
        problem_slug:problem.slug,
        language:$('language').value,
        code:editor.getValue(),
        action:action||'question',
        question:action==='question'?text:null,
        hint_level:hintLevel,
        execution:lastExecution,
        session_id:mentorSessionId
      })
    });
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.detail||'Mentor request failed.');
    mentorSessionId=data.session_id||mentorSessionId;
    mentorMessages.push({role:'assistant',text:data.answer||'No mentor response.'});
    if(action==='hint')hintLevel=Math.min(4,hintLevel+1);
    renderMentor();
  }catch(err){
    mentorMessages.push({role:'assistant',text:err.message||'Unable to contact AI Mentor.'});
    renderMentor();
  }finally{
    mentorThinking=false;
    $('mentor-send').disabled=false;
    document.querySelectorAll('.mentor-action').forEach(b=>b.disabled=false);
    renderMentor();
  }
}
function renderResults(data){
  lastExecution=data;
  $('results').classList.remove('hidden');
  $('result-badge').textContent=data.status||'Complete';
  const host=$('result-body');
  host.innerHTML=(data.results||[]).map(t=>{
    const pass=!!t.passed;
    return '<div class="rounded-lg border '+(pass?'border-emerald-800':'border-rose-800')+' bg-slate-950 p-3"><div class="flex justify-between text-[10px]"><span>'+esc(t.test||'Test')+' · '+esc(t.status||'')+'</span><span>'+esc(t.runtime_ms||'')+' ms</span></div>'+(t.message?'<div class="mt-1 text-[10px] text-slate-400">'+esc(t.message)+'</div>':'')+'<\/div>';
  }).join('')||'<div class="text-xs text-slate-500">No test results.</div>';
}
async function execute(mode){
  if(!problem||!editor)return;
  const code=editor.getValue();
  if(!code.trim()){toast('Write code first.');return}
  $('run-btn').disabled=true;$('submit-btn').disabled=true;
  const activeButton=mode==='submit'?$ ('submit-btn'):$ ('run-btn');
  activeButton?.classList.add('cm-loading');
  activeButton?.querySelector('.material-symbols-outlined')?.classList.add('opacity-50');
  $('execution-status').textContent=mode==='submit'?'Submitting…':'Running…';
  try{
    const res=await fetch(API+'/execution/run',{
      method:'POST',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},
      body:JSON.stringify({problem_slug:problem.slug,language:$('language').value,code,mode})
    });
    const data=await res.json().catch(()=>({}));
    if(res.status===401){localStorage.removeItem(TOKEN_KEY);location.replace('auth.html');return}
    if(!res.ok)throw new Error(data.detail||'Execution failed.');
    renderResults(data);
    $('execution-status').textContent=(data.status||'Complete')+' · '+(data.summary||'');
  }catch(err){
    $('execution-status').textContent=err.message||'Execution failed.';
    $('results').classList.remove('hidden');
    $('result-body').innerHTML='<div class="text-xs text-rose-400 p-3">'+esc(err.message||'Execution failed.')+'</div>';
  }finally{
    $('run-btn').disabled=false;$('submit-btn').disabled=false;
    $('run-btn').classList.remove('cm-loading');$('submit-btn').classList.remove('cm-loading');
    $('run-btn').querySelector('.material-symbols-outlined')?.classList.remove('opacity-50');
    $('submit-btn').querySelector('.material-symbols-outlined')?.classList.remove('opacity-50');
  }
}
function initEditor(){
  require.config({paths:{vs:'https://cdn.jsdelivr.net/npm/monaco-editor/min/vs'}});
  require(['vs/editor/editor.main'],()=>{
    editor=monaco.editor.create($('editor'),{
      value:'',
      language:LANG_IDS[$('language').value],
      theme:'vs-dark',
      automaticLayout:true,
      fontFamily:'JetBrains Mono, monospace',
      fontSize:13,
      minimap:{enabled:true},
      padding:{top:14,bottom:14},
      scrollBeyondLastLine:false
    });
    editor.onDidChangeModelContent(()=>{
      if(!problem)return;
      localStorage.setItem(draftKey(),editor.getValue());
      $('save-status').textContent='Saved locally';
    });
    if(problem)loadDraft();
    $('run-btn').disabled=!problem;
    $('submit-btn').disabled=!problem;
  },err=>showError('Code editor failed to load. Refresh the page.'));
}
async function load(){
  if(!requireAuth())return;

  const slug=new URLSearchParams(location.search).get('problem');
  if(!slug){location.replace('practice.html');return}

  // Start the problem request immediately. Profile/account data is independent
  // and should never delay the statement/editor workspace.
  const problemPromise=fetch(
    API+'/problems/'+encodeURIComponent(slug),
    {headers:{Authorization:'Bearer '+token()}}
  );
  const profilePromise=Promise.all([
    fetch(API+'/profile',{headers:{Authorization:'Bearer '+token()}}),
    fetch(API+'/auth/me',{headers:{Authorization:'Bearer '+token()}})
  ]);

  try{
    const res=await problemPromise;
    if(res.status===401){localStorage.removeItem(TOKEN_KEY);location.replace('auth.html');return}
    if(!res.ok){
      const body=await res.json().catch(()=>({}));
      throw new Error(body.detail||'Problem not found.');
    }

    problem=await res.json();
    renderProblem();
    $('language').dispatchEvent(new Event('change'));
    $('run-btn').disabled=false;
    $('submit-btn').disabled=false;

    // Mentor history is supplementary; don't hold the problem workspace hostage
    // while its session data is loading.
    void loadMentorHistory();
  }catch(err){
    showError(err.message||'Unable to load the requested problem.');
  }

  try{
    const [profileRes,userRes]=await profilePromise;
    if(profileRes.status===401||userRes.status===401){
      localStorage.removeItem(TOKEN_KEY);
      location.replace('auth.html');
      return;
    }
    const profile=profileRes.ok?await profileRes.json():{};
    const user=userRes.ok?await userRes.json():{};
    userId=String(user.id||'unknown');
    $('account-name').textContent=profile.full_name||'CodeMentor User';
    $('account-email').textContent=user.email||'Signed in';

    if(profile.preferred_language&&[...$('language').options].some(o=>o.value===profile.preferred_language)){
      $('language').value=profile.preferred_language;
    }

    if(problem){
      loadDraft();
    }
    restoreResultsHeight();
  }catch(err){
    console.warn('Problem workspace identity load failed:',err);
  }
}
$('back-btn').addEventListener('click',()=>location.href='practice.html');
$('account-btn').addEventListener('click',e=>{e.stopPropagation();$('account-menu').classList.toggle('hidden')});
document.addEventListener('click',e=>{if(!$('account-menu').contains(e.target)&&e.target!==$('account-btn'))$('account-menu').classList.add('hidden')});
$('logout-btn').addEventListener('click',()=>{localStorage.removeItem(TOKEN_KEY);location.replace('auth.html')});
$('language').addEventListener('change',()=>{
  if(!editor||!problem)return;
  monaco.editor.setModelLanguage(editor.getModel(),LANG_IDS[$('language').value]);
  loadDraft();
});
$('reset-btn').addEventListener('click',()=>{if(!problem||!editor)return;localStorage.removeItem(draftKey());editor.setValue(starterCode($('language').value));$('save-status').textContent='Starter'});
$('run-btn').addEventListener('click',()=>execute('run'));
$('submit-btn').addEventListener('click',()=>execute('submit'));
$('clear-results').addEventListener('click',()=>{$('results').classList.add('hidden');$('result-body').innerHTML='';lastExecution=null});
$('mentor-open').addEventListener('click',()=>{const panel=$('mentor-panel');const isOpen=!panel.classList.contains('hidden');panel.classList.toggle('hidden',isOpen);panel.classList.toggle('flex',!isOpen);if(!isOpen)renderMentor()});
$('mentor-close').addEventListener('click',()=>{$('mentor-panel').classList.add('hidden');$('mentor-panel').classList.remove('flex')});
$('mentor-clear').addEventListener('click',async()=>{mentorMessages=[];mentorSessionId=null;renderMentor()});
document.querySelectorAll('.mentor-action').forEach(b=>b.addEventListener('click',()=>askMentor(b.dataset.mentor)));
$('mentor-send').addEventListener('click',()=>{const q=$('mentor-input').value.trim();if(q){$('mentor-input').value='';askMentor('question',q)}});
$('mentor-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();$('mentor-send').click()}});
$('splitter').addEventListener('pointerdown',e=>{
  const main=document.querySelector('main');
  const move=ev=>{const width=Math.max(320,Math.min(main.clientWidth-450,ev.clientX));main.style.gridTemplateColumns=width+'px 6px minmax(0,1fr)'};
  const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
});
function initResultsResizer(){
  const results=$('results');
  const handle=$('results-resizer');
  const main=document.querySelector('main');
  if(!results||!handle||!main)return;

  const storageKey=()=> 'cm_results_height_'+(userId||'unknown');
  const getMaxHeight=()=>Math.max(
    180,
    Math.min(
      Math.floor(main.getBoundingClientRect().height*.70),
      Math.floor(window.innerHeight*.70)
    )
  );

  const saved=Number(localStorage.getItem(storageKey()));
  if(Number.isFinite(saved)&&saved>=140){
    results.style.height=Math.min(saved,getMaxHeight())+'px';
  }

  let dragging=false;
  let startY=0;
  let startHeight=260;

  const move=e=>{
    if(!dragging)return;
    const next=Math.max(140,Math.min(getMaxHeight(),startHeight+(startY-e.clientY)));
    results.style.height=Math.round(next)+'px';
    editor?.layout();
  };

  const stop=()=>{
    if(!dragging)return;
    dragging=false;
    document.body.style.userSelect='';
    localStorage.setItem(
      storageKey(),
      String(Math.round(results.getBoundingClientRect().height))
    );
    window.removeEventListener('pointermove',move);
    window.removeEventListener('pointerup',stop);
    window.removeEventListener('pointercancel',stop);
  };

  handle.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    e.preventDefault();
    dragging=true;
    startY=e.clientY;
    startHeight=results.getBoundingClientRect().height;
    document.body.style.userSelect='none';
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',stop);
    window.addEventListener('pointercancel',stop);
  });
}

function restoreResultsHeight(){
  const results=$('results');
  if(!results)return;
  const saved=Number(localStorage.getItem('cm_results_height_'+(userId||'unknown')));
  if(Number.isFinite(saved)&&saved>=140){
    const main=document.querySelector('main');
    const max=Math.max(180,Math.min(
      Math.floor(main.getBoundingClientRect().height*.70),
      Math.floor(window.innerHeight*.70)
    ));
    results.style.height=Math.min(saved,max)+'px';
  }
}

initEditor();
initResultsResizer();
load();
</script>
