<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CodeMentor AI — Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:"Plus Jakarta Sans",sans-serif}.mono{font-family:"JetBrains Mono",monospace}</style>  <link rel="stylesheet" href="ui.css">
  <script src="ui.js" defer></script>
</head><body class="min-h-screen bg-[#f8f9ff] text-[#0b1c30]">
<header class="fixed top-0 inset-x-0 z-50 h-16 bg-white/90 backdrop-blur-xl border-b border-slate-200"><div class="h-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between"><div class="flex items-center gap-3"><div class="w-9 h-9 rounded-lg bg-[#4338ca] text-white flex items-center justify-center"><span class="material-symbols-outlined">terminal</span></div><div class="font-bold">CodeMentor <span class="mono text-[#2a14b4] text-xs">AI</span></div></div><nav class="flex items-center gap-2"><button onclick="location.href='dashboard.html?v=20260924'" class="px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100">Dashboard</button><button onclick="location.href='preferences.html?v=20260921'" class="px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100">Preferences</button></nav></div></header>
<main class="pt-24 pb-12 px-4 sm:px-6 lg:px-8"><div class="max-w-4xl mx-auto"><div class="mb-7"><div class="mono text-[11px] uppercase tracking-wider text-[#2a14b4] font-semibold">Workspace controls</div><h1 class="text-3xl font-bold mt-1">Settings</h1><p class="text-sm text-slate-600 mt-2">Account and application controls are kept separate from your learning preferences.</p></div>
<div id="message" class="hidden mb-5 rounded-xl px-4 py-3 text-sm border"></div>
<section class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 sm:p-8 mb-5"><h2 class="text-lg font-bold">Account</h2><div class="mt-5 grid md:grid-cols-2 gap-4"><div class="rounded-xl bg-slate-50 p-4"><div class="mono text-[10px] uppercase tracking-wider text-slate-500">Email</div><div id="email" class="font-semibold mt-1">Loading...</div></div><div class="rounded-xl bg-slate-50 p-4"><div class="mono text-[10px] uppercase tracking-wider text-slate-500">Session</div><div class="font-semibold mt-1">Authenticated</div></div></div></section>
<section class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 sm:p-8 mb-5"><h2 class="text-lg font-bold">Application settings</h2><div class="divide-y divide-slate-100 mt-3">
<label class="flex items-center justify-between gap-4 py-4 cursor-pointer"><div><div class="font-semibold text-sm">Practice notifications</div><div class="text-xs text-slate-500 mt-1">Keep reminders for practice activity enabled on this browser.</div></div><input id="notifications" type="checkbox" class="w-5 h-5 accent-[#4338ca]"></label>
<label class="flex items-center justify-between gap-4 py-4 cursor-pointer"><div><div class="font-semibold text-sm">Compact dashboard mode</div><div class="text-xs text-slate-500 mt-1">Reduce spacing in the dashboard interface.</div></div><input id="compact" type="checkbox" class="w-5 h-5 accent-[#4338ca]"></label>
</div></section>
<section class="bg-white rounded-2xl shadow-sm border border-rose-100 p-6 sm:p-8"><h2 class="text-lg font-bold text-rose-700">Session</h2><p class="text-sm text-slate-600 mt-1">Sign out from this browser. Your saved server-side profile remains intact.</p><button id="logout" class="mt-4 px-4 py-2.5 rounded-lg bg-rose-600 text-white font-semibold hover:bg-rose-700">Log out</button></section>
</div></main>
<script>const KEY='codementor_access_token',API='http://127.0.0.1:8000';function t(){return localStorage.getItem(KEY)}function auth(){if(!t()){location.replace('auth.html');return false}return true}function save(){localStorage.setItem('cm_notifications',document.getElementById('notifications').checked?'1':'0');localStorage.setItem('cm_compact',document.getElementById('compact').checked?'1':'0')}async function load(){if(!auth())return;document.getElementById('notifications').checked=localStorage.getItem('cm_notifications')!=='0';document.getElementById('compact').checked=localStorage.getItem('cm_compact')==='1';try{const r=await fetch(API+'/auth/me',{headers:{Authorization:'Bearer '+t()}});if(r.status===401){localStorage.removeItem(KEY);location.replace('auth.html');return}const d=await r.json();document.getElementById('email').textContent=d.email||'Signed in'}catch(e){document.getElementById('email').textContent='Unable to load account'}}</script>
<script>document.getElementById('notifications').addEventListener('change',save);document.getElementById('compact').addEventListener('change',save);document.getElementById('logout').addEventListener('click',()=>{localStorage.removeItem(KEY);location.replace('auth.html')});load();</script></body></html>
